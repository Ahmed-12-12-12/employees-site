<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>باركود الحضور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.webp" type="image/webp">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#23242a 0%,#16171a 60%);color:#f4f4f5;font-family:Cairo,Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:2vh 16px;text-align:center;overflow:hidden;-webkit-font-smoothing:antialiased}
.head{display:flex;align-items:center;gap:16px}
.logo{background:#fff;border-radius:16px;width:min(9vh,72px);height:min(9vh,72px);overflow:hidden;display:grid;place-items:center;flex:none}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.35)}
h1{margin:0;font-size:clamp(20px,3.8vh,38px);font-weight:700;line-height:1.3;text-align:start}
.site{color:#c9c9cf;font-size:clamp(14px,2.4vh,22px);font-weight:500;text-align:start}
.site::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#f5ad1b;margin-inline-end:8px;vertical-align:middle}
.qr{background:#fff;border-radius:24px;padding:2.4vh;width:min(56vh,86vw);aspect-ratio:1;display:grid;place-items:center;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.qr svg{width:100%;height:100%}
.bar{width:min(56vh,86vw);height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#f5ad1b;width:100%;transition:width 1s linear;border-radius:99px}
.clock{font-size:clamp(26px,5.4vh,54px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#fff}
.hint{color:#8e8e96;font-size:clamp(13px,2vh,18px)}
.err{background:rgba(208,96,91,.15);color:#f3a8a3;border:1px solid rgba(208,96,91,.35);padding:12px 18px;border-radius:12px;font-size:18px;max-width:640px}
.fs{position:fixed;top:14px;inset-inline-start:14px;background:rgba(255,255,255,.06);color:#c9c9cf;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.fs:hover{background:rgba(255,255,255,.12)}
</style>
</head>
<body>
<button class="fs" id="fs" title="ملء الشاشة">ملء الشاشة</button>
<div class="head"><div class="logo"><img src="assets/logo.webp" alt="سيتي مكس"></div><div><h1>سجّل حضورك وانصرافك</h1><div class="site" id="site">…</div></div></div>
<div class="qr" id="qr"></div>
<div class="bar"><i id="bar"></i></div>
<div class="clock" id="clock"></div>
<div class="hint">امسح الرمز بكاميرا جوالك المفعّل · يتجدد كل 30 ثانية</div>
<div class="err" id="err" hidden></div>
<script>
(function(){
  const P=new URLSearchParams(location.search), site=P.get('site'), k=P.get('k');
  const $=id=>document.getElementById(id);
  let offset=0, timer=null, wake=null;
  function err(m){ $('err').textContent=m; $('err').hidden=!m; }
  function draw(tok){
    const url=new URL('att.html',location.href); url.search='?s='+encodeURIComponent(site)+'&t='+tok;
    const q=qrcode(0,'M'); q.addData(url.href); q.make();
    $('qr').innerHTML=q.createSvgTag({cellSize:8,margin:0,scalable:true});
  }
  async function tick(){
    clearTimeout(timer);
    try{
      const r=await fetch('api.php?a=kiosk_token',{method:'POST',headers:{'Content-Type':'application/json','X-Req':'1'},body:JSON.stringify({site:site,k:k})});
      const j=await r.json(); if(!r.ok||j.error) throw new Error(j.error||'خطأ');
      err(''); $('site').textContent=j.site; draw(j.token);
      offset=new Date(j.now.replace(' ','T'))-Date.now();
      const left=j.left; const bar=$('bar'); bar.style.transition='none'; bar.style.width=(left/30*100)+'%';
      requestAnimationFrame(()=>{ bar.style.transition='width '+left+'s linear'; bar.style.width='0%'; });
      timer=setTimeout(tick,left*1000+400);
    }catch(e){ err('تعذّر تحديث الباركود: '+e.message+' — إعادة المحاولة…'); $('qr').innerHTML=''; timer=setTimeout(tick,5000); }
  }
  setInterval(()=>{ const d=new Date(Date.now()+offset); $('clock').textContent=d.toLocaleTimeString('ar-SA-u-nu-latn',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); },500);
  $('fs').onclick=()=>{ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); };
  async function keepAwake(){ try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ keepAwake(); tick(); } });
  if(!site||!k){ err('رابط الشاشة غير مكتمل. انسخه من لوحة الإدارة ← المواقع.'); return; }
  keepAwake(); tick();
})();
</script>
</body>
</html>
