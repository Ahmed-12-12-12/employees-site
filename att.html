<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>الحضور والانصراف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="assets/logo.webp">
<style>
:root{--y:#f5ad1b;--y50:#fef8ea;--bg:#f6f6f4;--card:#fff;--tx:#1d1d1f;--tx2:#3d3d40;--mu:#77767c;--ln:#ebeae6;--ink:#1f2024;
  --ok:#2f7a55;--okbg:#ebf5ef;--bad:#a8322b;--badbg:#fbecea}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--card:#1a1b1e;--tx:#f2f2f3;--tx2:#d4d4d8;--mu:#9a9aa1;--ln:#2a2b30;--ink:#f2f2f3;--okbg:#17291f;--badbg:#2e1716;--ok:#7ccaa0;--bad:#f0918b}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;min-height:100vh;font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{background:#18191c;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header .lg{width:40px;height:40px;border-radius:11px;background:#fff;overflow:hidden;flex:none}
header .lg img{width:100%;height:100%;object-fit:cover;transform:scale(1.35)}
header b{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
header span{color:#a6a6ad;font-size:12.5px}
main{padding:18px 16px 32px;max-width:460px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{margin:0 0 4px;font-size:19px;font-weight:700}
.mu{color:var(--mu)}
label{display:block;font-weight:600;font-size:13.5px;margin:16px 0 6px;color:var(--tx2)}
input{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;font:inherit;font-size:17px;background:var(--card);color:var(--tx);text-align:center;letter-spacing:1px;transition:border-color .15s,box-shadow .15s}
input:focus{outline:0;border-color:var(--y);box-shadow:0 0 0 3px rgba(245,173,27,.25)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid transparent;border-radius:14px;padding:15px;font:inherit;font-size:16.5px;font-weight:700;cursor:pointer;margin-top:12px;background:var(--ink);color:var(--card)}
.btn.sec{background:var(--card);color:var(--tx);border-color:var(--ln)}
.btn.ghost{background:transparent;color:var(--tx2);border-color:var(--ln);font-size:14.5px;padding:11px;font-weight:600}
.btn:disabled{opacity:.55}
.btn .i{width:21px;height:21px}
.status{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg);margin-top:16px;font-weight:600;font-size:14.5px;color:var(--tx2)}
.dot{width:10px;height:10px;border-radius:50%;background:#c9c8c3;flex:none}
.dot.in{background:#4f9d76;box-shadow:0 0 0 4px rgba(79,157,118,.18)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.times div{border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}
.times small{display:block;color:var(--mu);font-weight:500;font-size:12.5px}
.times b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.sec-t{font-size:13px;font-weight:700;color:var(--mu);text-align:center;margin-bottom:2px}
.res{text-align:center;padding:32px 22px}
.res .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px}
.res .ic .i{width:32px;height:32px;stroke-width:2}
.res.ok .ic{background:var(--okbg);color:var(--ok)}
.res.no .ic{background:var(--badbg);color:var(--bad)}
.res.wait .ic{background:var(--bg);color:var(--mu)}
.res h2{font-size:20px;margin-top:10px}
.big{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3;margin-top:4px}
.scan{position:fixed;inset:0;background:rgba(10,10,12,.96);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.scan video{width:min(88vw,420px);aspect-ratio:1;object-fit:cover;border-radius:22px;border:3px solid var(--y)}
.scan p{color:#e4e4e7;margin:0;font-weight:600}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin-top:10px;font-size:14px;text-align:center}
.clock{font-size:13px;color:var(--mu);font-weight:500;margin-bottom:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM21 14v.01M14 21h.01M17 21h4v-4"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-no" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-load" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></symbol>
</svg>
<header><div class="lg"><img src="assets/logo.webp" alt="سيتي مكس"></div><div><b>الحضور والانصراف</b><span>سيتي مكس</span></div></header>
<main id="app"><div class="card mu">جارٍ التحميل…</div></main>
<div class="scan" id="scan" hidden>
  <video id="vid" playsinline muted></video>
  <p>وجّه الكاميرا إلى الباركود على الشاشة</p>
  <button class="btn ghost" id="scanClose" style="color:#fff;max-width:300px">إلغاء</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(){try{return localStorage.getItem('attKey')}catch(e){return null}},set(v){try{v?localStorage.setItem('attKey',v):localStorage.removeItem('attKey')}catch(e){}}};
const hm=t=>t?t.slice(11,16):'—';
const ic=n=>'<svg class="i"><use href="#i-'+n+'"/></svg>';
async function api(a,body){
  let r; try{ r=await fetch('api.php?a='+a,{method:'POST',headers:{'Content-Type':'application/json','X-Req':'1'},body:JSON.stringify(body)}); }catch(e){ throw Object.assign(new Error('لا يوجد اتصال بالإنترنت'),{code:0}); }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok||j.error) throw Object.assign(new Error(j.error||('خطأ '+r.status)),{code:r.status});
  return j;
}
const P=new URLSearchParams(location.search); let qrSite=P.get('s'), qrTok=P.get('t');
if(qrTok) history.replaceState(null,'',location.pathname); // لا يُعاد الإرسال عند التحديث

/* ---------- تفعيل ---------- */
function activation(msg){
  app.innerHTML='<div class="card"><h2>تفعيل جوالك</h2><p class="mu">أدخل رقم هويتك ورمز التفعيل الذي وصلك من الإدارة. يتم هذا مرة واحدة فقط.</p>'+
    '<form id="af"><label>رقم الهوية</label><input id="nid" inputmode="numeric" autocomplete="off" required>'+
    '<label>رمز التفعيل</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>'+
    '<button class="btn">تفعيل</button><div class="err" id="ae">'+esc(msg||'')+'</div></form></div>';
  document.getElementById('af').onsubmit=async ev=>{ ev.preventDefault(); const b=ev.target.querySelector('button'); b.disabled=true;
    try{ const r=await api('emp_activate',{nid:document.getElementById('nid').value.trim(),code:document.getElementById('code').value.trim()});
      store.set(r.key); if(!store.get()) throw new Error('المتصفح يمنع حفظ البيانات (التصفح الخاص؟). افتح الرابط في متصفح عادي.'); home(); }
    catch(e){ document.getElementById('ae').textContent=e.message; b.disabled=false; } };
}

/* ---------- الرئيسية ---------- */
let st=null;
async function home(){
  const key=store.get(); if(!key) return activation(qrTok?'فعّل جوالك أولًا ثم امسح الباركود مرة أخرى.':'');
  try{ st=await api('emp_status',{key}); }
  catch(e){ if(e.code===403){ store.set(null); return activation(e.message); } app.innerHTML='<div class="card"><div class="err">'+esc(e.message)+'</div><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>'; return; }
  if(qrTok){ const t=qrTok; qrTok=null; return punch({site:qrSite,token:t}); }
  const inside=!!st.open, recs=st.today||[];
  const first=recs[0], last=recs[recs.length-1];
  app.innerHTML='<div class="card"><div class="clock" id="clk"></div><h2>مرحبًا، '+esc(st.name.split(' ')[0])+'</h2>'+
    (st.shift?'<div class="mu">ورديتك: '+esc(st.shift.name)+' ('+st.shift.start_time+' – '+st.shift.end_time+')</div>':'')+
    '<div class="status"><span class="dot '+(inside?'in':'')+'"></span>'+(inside?'أنت داخل العمل منذ '+hm(st.open):'لم تسجّل حضورًا الآن')+'</div>'+
    '<div class="times"><div><small>أول حضور اليوم</small><b>'+hm(first&&first.in_time)+'</b></div><div><small>آخر انصراف</small><b>'+hm(last&&last.out_time)+'</b></div></div></div>'+
    '<div class="card"><div class="sec-t">'+(inside?'تسجيل الانصراف':'تسجيل الحضور')+'</div>'+
    (st.qr?'<button class="btn" id="bScan">'+ic('qr')+'مسح الباركود</button>':'')+
    (st.gps?'<button class="btn sec" id="bGps">'+ic('pin')+'تسجيل بموقعي</button>':'')+
    (!st.qr&&!st.gps?'<p class="err">لا توجد طريقة تسجيل مفعّلة لك. تواصل مع الإدارة.</p>':'')+
    '<div class="err" id="he"></div></div>';
  const tick=()=>{ const c=document.getElementById('clk'); if(c) c.textContent=new Date().toLocaleString('ar-SA-u-nu-latn',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}); };
  tick(); clearInterval(home._t); home._t=setInterval(tick,15000);
  const bs=document.getElementById('bScan'), bg=document.getElementById('bGps');
  if(bs) bs.onclick=startScan;
  if(bg) bg.onclick=async()=>{ bg.disabled=true; bg.textContent='جارٍ تحديد موقعك…';
    try{ const p=await locate(15000,true); await punch({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}); }
    catch(e){ document.getElementById('he').textContent=e.message; bg.disabled=false; bg.innerHTML=ic('pin')+'تسجيل بموقعي'; } };
}
function locate(timeout,strict){ return new Promise((res,rej)=>{
  if(!navigator.geolocation) return rej(new Error('الجوال لا يدعم تحديد الموقع'));
  navigator.geolocation.getCurrentPosition(res,e=>rej(new Error(e.code===1?'يجب السماح للمتصفح بالوصول إلى موقعك من الإعدادات':'تعذّر تحديد موقعك. تأكد من تشغيل GPS وأعد المحاولة.')),{enableHighAccuracy:true,timeout,maximumAge:0}); }); }

/* ---------- تسجيل ---------- */
async function punch(body){
  app.innerHTML='<div class="card res wait"><div class="ic"><svg class="i spin"><use href="#i-load"/></svg></div><h2>جارٍ التسجيل…</h2></div>';
  body.key=store.get();
  if(body.token&&!body.lat){ try{ const p=await locate(4000); body.lat=p.coords.latitude; body.lng=p.coords.longitude; body.acc=p.coords.accuracy; }catch(e){} } // اختياري للتوثيق
  try{
    const r=await api('emp_punch',body);
    if(navigator.vibrate) navigator.vibrate(120);
    app.innerHTML='<div class="card res ok"><div class="ic">'+ic('ok')+'</div><h2>'+(r.type==='in'?'تم تسجيل الحضور':'تم تسجيل الانصراف')+'</h2><div class="big">'+hm(r.time)+'</div><div class="mu">'+esc(r.site)+'</div><button class="btn ghost" id="back">رجوع</button></div>';
  }catch(e){
    if(e.code===403&&/مربوط/.test(e.message)){ store.set(null); return activation(e.message); }
    app.innerHTML='<div class="card res no"><div class="ic">'+ic('no')+'</div><h2>لم يتم التسجيل</h2><p class="mu">'+esc(e.message)+'</p><button class="btn sec" id="back">رجوع</button></div>';
  }
  document.getElementById('back').onclick=home;
}

/* ---------- ماسح الباركود داخل الصفحة ---------- */
let stream=null, raf=0;
async function startScan(){
  const he=document.getElementById('he');
  if(typeof jsQR==='undefined'){ he.textContent='تعذّر تحميل الماسح. يمكنك مسح الباركود بكاميرا الجوال العادية.'; return; }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}); }
  catch(e){ he.textContent='تعذّر فتح الكاميرا. اسمح بالوصول للكاميرا أو امسح الباركود بكاميرا الجوال العادية.'; return; }
  const v=document.getElementById('vid'); v.srcObject=stream; await v.play(); document.getElementById('scan').hidden=false;
  const c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true});
  const loop=()=>{ if(v.readyState===v.HAVE_ENOUGH_DATA){ const w=Math.min(640,v.videoWidth), h=Math.round(w*v.videoHeight/v.videoWidth); c.width=w; c.height=h; x.drawImage(v,0,0,w,h);
      const code=jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});
      if(code&&code.data){ try{ const u=new URL(code.data); const s=u.searchParams.get('s'), t=u.searchParams.get('t'); if(s&&t){ stopScan(); return punch({site:s,token:t}); } }catch(e){} } }
    raf=requestAnimationFrame(loop); };
  loop();
}
function stopScan(){ cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; document.getElementById('scan').hidden=true; }
document.getElementById('scanClose').onclick=stopScan;

home();
})();
</script>
</body>
</html>
